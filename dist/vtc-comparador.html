<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Auditoría de Viajes VTC v3.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<body style="margin: 0; padding: 0; width: 100%; height: 100%; background-color: transparent !important; color: var(--ink);">
<style>
/* ── TOKENS ─────────────────────────────────────────── */
#vtc-app-wrapper {
  --ink:        #1a1a2e;
  --ink-mid:    #4a4a6a;
  --ink-light:  #8888aa;
  --surface:    #f7f7fb;
  --card:       #ffffff;
  --border:     #e2e2ee;
  --border-mid: #c8c8e0;
  --accent:     #3d5af1;
  --accent-dim: #e8ecfe;
  --ok:         #1a9e6e;
  --ok-dim:     #e0f5ed;
  --warn:       #d97706;
  --warn-dim:   #fef3c7;
  --danger:     #dc2626;
  --danger-dim: #fee2e2;
  --radius:     10px;
  --radius-sm:  6px;
  --shadow:     0 1px 3px rgba(0,0,40,.07), 0 4px 12px rgba(0,0,40,.05);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  color: var(--ink);
}
#vtc-app-wrapper * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ── HEADER ─────────────────────────────────────────── */
.header{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:0 24px;height:54px;display:flex;align-items:center;
  justify-content:space-between;
}
.header-left{display:flex;align-items:center;gap:10px;}
.header-logo{
  width:32px;height:32px;border-radius:8px;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
}
.header-logo svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.header h1{font-size:15px;font-weight:600;color:var(--ink);}
.header-sub{font-size:12px;color:var(--ink-light);margin-left:4px;}
.badge-db{
  background:var(--accent-dim);color:var(--accent);
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;
  letter-spacing:.03em;
}

/* ── LAYOUT ─────────────────────────────────────────── */
.main{padding:20px 24px;max-width:1380px;}

/* ── UPLOAD ZONE ────────────────────────────────────── */
.upload-zone{
  border:2px dashed var(--border-mid);border-radius:var(--radius);
  padding:36px 24px;text-align:center;cursor:pointer;
  transition:border-color .15s,background .15s;
  background:var(--card);margin-bottom:20px;
}
.upload-zone:hover,.upload-zone.drag{
  border-color:var(--accent);background:var(--accent-dim);}
.upload-zone svg{width:36px;height:36px;stroke:var(--ink-light);fill:none;
  stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px;}
.upload-zone.drag svg{stroke:var(--accent);}
.upload-zone p{color:var(--ink-mid);font-size:13px;}
.upload-zone strong{color:var(--accent);}
.upload-zone input{display:none;}

/* ── SETTINGS BAR ───────────────────────────────────── */
.settings-bar{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 18px;margin-bottom:20px;
  display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
}
.setting-group{display:flex;flex-direction:column;gap:4px;}
.setting-group label{font-size:11px;font-weight:600;color:var(--ink-light);
  text-transform:uppercase;letter-spacing:.05em;}
.setting-group input,.setting-group select{
  height:34px;border:1px solid var(--border-mid);border-radius:var(--radius-sm);
  padding:0 10px;font-size:13px;color:var(--ink);background:#fff;outline:none;
  min-width:130px;
}
.setting-group input:focus,.setting-group select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,90,241,.12);}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;
  font-weight:600;cursor:pointer;border:1px solid var(--border-mid);
  background:#fff;color:var(--ink);transition:all .12s;
}
.btn:hover{background:var(--surface);}
.btn:active{transform:scale(.98);}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#2d49e0;}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface);}

/* ── METRICS ────────────────────────────────────────── */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;margin-bottom:20px;}
.metric{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;
  display:flex;flex-direction:column;gap:4px;
}
.metric-label{font-size:11px;font-weight:600;color:var(--ink-light);
  text-transform:uppercase;letter-spacing:.05em;}
.metric-value{font-size:28px;font-weight:700;line-height:1.1;color:var(--ink);}
.metric-sub{font-size:11px;color:var(--ink-light);}
.metric.m-danger .metric-value{color:var(--danger);}
.metric.m-ok .metric-value{color:var(--ok);}
.metric.m-warn .metric-value{color:var(--warn);}
.metric.m-accent .metric-value{color:var(--accent);}

/* ── PROGRESS BAR ───────────────────────────────────── */
.coverage-bar-wrap{margin-bottom:20px;}
.coverage-label{font-size:12px;color:var(--ink-mid);margin-bottom:6px;
  display:flex;justify-content:space-between;}
.coverage-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;}
.coverage-fill{height:100%;border-radius:4px;background:var(--ok);
  transition:width .6s ease;}

/* ── TABLE CARD ─────────────────────────────────────── */
.table-card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.table-toolbar{
  padding:12px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
}
.table-title{font-size:14px;font-weight:600;color:var(--ink);}
.table-controls{display:flex;gap:8px;align-items:center;}
.search{
  height:32px;border:1px solid var(--border-mid);border-radius:var(--radius-sm);
  padding:0 10px;font-size:13px;outline:none;width:210px;color:var(--ink);
}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,90,241,.1);}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  padding:9px 14px;text-align:left;
  font-size:11px;font-weight:700;color:var(--ink-light);
  text-transform:uppercase;letter-spacing:.05em;
  background:var(--surface);border-bottom:1px solid var(--border);
  white-space:nowrap;cursor:pointer;user-select:none;
}
thead th:hover{background:#ececf6;}
thead th.sorted{color:var(--accent);}
tbody tr.vehicle-row{
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .08s;
}
tbody tr.vehicle-row:hover{background:var(--accent-dim);}
tbody tr.vehicle-row td{padding:11px 14px;font-weight:500;}

/* ── EXPAND ROWS ─────────────────────────────────────── */
.expand-section{display:none;}
.expand-section.open{display:table-row-group;}
.expand-inner td{padding:0!important;}
.trips-sub{
  background:#fafafe;border-top:1px solid var(--border);
  padding:12px 18px 16px 42px;
}
.trips-sub-title{font-size:11px;font-weight:700;color:var(--ink-light);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.trip-list{display:flex;flex-direction:column;gap:6px;}
.trip-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 14px;
  display:grid;grid-template-columns:100px 90px 90px 90px 1fr auto;
  align-items:center;gap:10px;font-size:12px;
}
.trip-item:hover{border-color:var(--accent);}
.trip-date{font-weight:600;color:var(--ink);}
.trip-time{color:var(--ink-mid);}
.trip-dist{font-weight:600;color:var(--accent);}
.trip-dur{color:var(--ink-mid);}
.trip-route{color:var(--ink-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:11px;}
.trip-actions{display:flex;gap:6px;}
.trip-link{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:4px;font-size:11px;font-weight:600;
  background:var(--accent-dim);color:var(--accent);
  text-decoration:none;border:1px solid transparent;
  transition:background .1s;
}
.trip-link:hover{background:#d5dcfc;}

/* ── PILLS ───────────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;padding:2px 8px;
  border-radius:20px;font-size:11px;font-weight:600;}
.pill-ok{background:var(--ok-dim);color:var(--ok);}
.pill-warn{background:var(--warn-dim);color:var(--warn);}
.pill-danger{background:var(--danger-dim);color:var(--danger);}
.pill-neutral{background:var(--surface);color:var(--ink-light);border:1px solid var(--border);}

/* ── MINI BAR ────────────────────────────────────────── */
.mini-bar{display:flex;align-items:center;gap:6px;}
.mini-bar-bg{width:80px;height:5px;background:var(--border);border-radius:3px;}
.mini-bar-fill{height:100%;border-radius:3px;}

/* ── STATE ───────────────────────────────────────────── */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;gap:12px;color:var(--ink-light);}
.state svg{width:44px;height:44px;stroke:var(--border-mid);fill:none;
  stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;}
.state p{font-size:13px;text-align:center;max-width:320px;line-height:1.6;}
.spinner{width:32px;height:32px;border:2.5px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .65s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.progress-msg{font-size:12px;color:var(--ink-mid);text-align:center;margin-top:6px;}

/* ── INFO BAR ────────────────────────────────────────── */
.info-bar{
  background:var(--accent-dim);border:1px solid #c5d0fa;
  border-radius:var(--radius-sm);padding:9px 14px;margin-bottom:16px;
  font-size:12px;color:var(--accent);display:flex;align-items:center;gap:8px;
}
.info-bar svg{width:14px;height:14px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

/* ── TABLE FOOTER ────────────────────────────────────── */
.table-footer{
  padding:10px 18px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--ink-light);
}

</style>

<script>
// --- data-manager.js ---
// data-manager.js
// Maneja toda la comunicación con Geotab, el parseo del CSV y el estado de los datos

const DataManager = (function() {
    let api = null;
    
    // Caché de entidades
    let cache = {
        users: null,
        devices: null,
        rules: null
    };

    // Estado del CSV
    let csvData = {
        trips: [],
        plates: new Set(),
        minDate: null,
        maxDate: null
    };

    // ── NORMALIZAR MATRÍCULA ─────────────────────────────────
    function normPlate(p) {
        return String(p || '').replace(/[\s\-]/g, '').toUpperCase().trim();
    }

    // ── PARSEAR FECHA DD/MM/YYYY HH:MM ───────────────────────
    function parseDate(s) {
        if (!s) return null;
        const m = s.match(/(\d{1,2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})/);
        if (!m) return null;
        return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]);
    }

    // ── WRAPPER API ──────────────────────────────────────────
    function callApi(method, params) {
        return new Promise((resolve, reject) => {
            if (!api) return reject(new Error("API no inicializada"));
            api.call(method, params, resolve, reject);
        });
    }

    return {
        init: function(geotabApi) {
            api = geotabApi;
        },

        // ── CACHÉ INTELIGENTE ────────────────────────────────────
        getUsers: async function() {
            if (cache.users) return cache.users;
            const users = await callApi('Get', { typeName: 'User', resultsLimit: 5000 });
            cache.users = {};
            users.forEach(u => {
                cache.users[u.id] = (u.firstName && u.lastName) ? (u.firstName + ' ' + u.lastName) : (u.name || 'Desconocido');
            });
            return cache.users;
        },

        getDevices: async function() {
            if (cache.devices) return cache.devices;
            const devices = await callApi('Get', { typeName: 'Device', resultsLimit: 2000 });
            cache.devices = {
                byId: {},
                byPlate: {} // Mapeo de matrícula normalizada a device
            };
            devices.forEach(d => {
                cache.devices.byId[d.id] = d;
                const np = normPlate(d.name);
                if (np) cache.devices.byPlate[np] = d;
            });
            return cache.devices;
        },

        getRules: async function() {
            if (cache.rules) return cache.rules;
            const rules = await callApi('Get', { typeName: 'Rule', resultsLimit: 5000 });
            cache.rules = rules;
            return cache.rules;
        },

        // ── LLAMADAS DIRECTAS (Sin Caché Global) ─────────────────
        getTrips: async function(deviceId, fromDate, toDate) {
            return await callApi('Get', {
                typeName: 'Trip',
                search: {
                    fromDate: fromDate,
                    toDate: toDate,
                    deviceSearch: { id: deviceId }
                },
                resultsLimit: 50000
            });
        },

        getExceptionEvents: async function(ruleId, fromDate, toDate) {
            return await callApi('Get', {
                typeName: 'ExceptionEvent',
                search: {
                    ruleSearch: { id: ruleId },
                    fromDate: fromDate,
                    toDate: toDate
                },
                resultsLimit: 100000
            });
        },

        // ── GESTIÓN DE CSV ───────────────────────────────────────
        parseCSV: function(text, filename) {
            text = text.replace(/^\uFEFF/, '');
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            if (lines.length < 2) throw new Error("CSV vacío o sin datos válidos");

            const header = lines[0].split(';');
            const idx = {};
            header.forEach((h, i) => { idx[h.trim()] = i; });

            const trips = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(';');
                const estado = (cols[idx['Estado del viaje']] || '').trim();
                if (estado !== 'completed') continue;

                const plate = normPlate(cols[idx['Matrícula']]);
                const reqStr = (cols[idx['Hora de la solicitud del viaje']] || '').trim();
                const arrStr = (cols[idx['Hora de llegada del viaje']] || '').trim();
                if (!plate || !reqStr || !arrStr) continue;

                trips.push({
                    uuid: cols[idx['UUID del viaje']],
                    conductor: (cols[idx['Nombre del conductor']] || '') + ' ' + (cols[idx['Apellido del conductor']] || ''),
                    plate: plate,
                    plateRaw: cols[idx['Matrícula']],
                    reqTime: parseDate(reqStr),
                    arrTime: parseDate(arrStr),
                    origin:  cols[idx['Dirección de recogida']] || '',
                    dest:    cols[idx['Dirección de destino']] || '',
                    dist:    parseFloat((cols[idx['Distancia del viaje']] || '0').replace(',','.')),
                    product: cols[idx['Tipo de producto']] || '',
                    payment: cols[idx['Tipo de pago']] || '',
                });
            }

            if (trips.length === 0) throw new Error("No se encontraron viajes 'completed' válidos en el CSV.");

            const allDates = trips.map(t => t.reqTime).filter(Boolean);
            const minDate = new Date(Math.min(...allDates));
            const maxDate = new Date(Math.max(...allDates));
            minDate.setHours(0,0,0,0);
            maxDate.setHours(23,59,59,999);

            csvData.trips = trips;
            csvData.plates = new Set(trips.map(t => t.plate));
            csvData.minDate = minDate.toISOString();
            csvData.maxDate = maxDate.toISOString();

            return {
                tripsCount: trips.length,
                platesCount: csvData.plates.size,
                minDate: minDate,
                maxDate: maxDate
            };
        },

        getCsvData: function() {
            return csvData;
        },
        
        getNormPlate: function(plate) {
            return normPlate(plate);
        }
    };
})();


// --- rule-manager.js ---
// rule-manager.js
// Responsable de buscar y cachear la regla de auditoría (Ej: Parada Rápida)

const RuleManager = (function() {
    let ruleIdParadaRapida = null;
    const RULE_NAME = "Parada Rápida"; // Literal exacto confirmado por el usuario

    return {
        init: async function() {
            try {
                const rules = await DataManager.getRules();
                // Buscar regla por nombre
                const rule = rules.find(r => r.name === RULE_NAME);
                
                if (rule) {
                    ruleIdParadaRapida = rule.id;
                    console.log(`[RuleManager] Regla encontrada: "${RULE_NAME}" (ID: ${ruleIdParadaRapida})`);
                } else {
                    console.warn(`[RuleManager] ATENCIÓN: No se encontró la regla "${RULE_NAME}" en MyGeotab.`);
                }
            } catch (e) {
                console.error("[RuleManager] Error al inicializar reglas", e);
            }
        },

        getParadaRapidaId: function() {
            return ruleIdParadaRapida;
        },

        hasParadaRapidaRule: function() {
            return ruleIdParadaRapida !== null;
        }
    };
})();


// --- stop-analyzer.js ---
// stop-analyzer.js
// Analiza las excepciones (Paradas Rápidas) y calcula tiempos reales

const StopAnalyzer = (function() {
    
    // Constante de tiempo a sumar por cada excepción (tiempo que tarda la regla en saltar)
    const OFFSET_SECONDS = 45;

    return {
        /**
         * Cruza los viajes de Geotab con los eventos de excepción
         * @param {Array} trips - Array de viajes Geotab (raw)
         * @param {Array} exceptionEvents - Array de eventos de la regla Parada Rápida
         */
        analyzeTrips: function(trips, exceptionEvents) {
            // Pre-agrupar excepciones por ID de vehículo para acelerar la búsqueda
            const eventsByDevice = {};
            exceptionEvents.forEach(e => {
                const devId = e.device.id;
                if (!eventsByDevice[devId]) eventsByDevice[devId] = [];
                eventsByDevice[devId].push(e);
            });

            // Analizar cada viaje
            trips.forEach(trip => {
                const devId = trip.device ? trip.device.id : trip._device.id;
                const tripEvents = eventsByDevice[devId] || [];
                const tripStart = new Date(trip.start || trip.startTime);
                const tripStop = new Date(trip.stop || trip.stopTime);

                // Filtrar las excepciones que ocurrieron DURANTE este viaje
                const exceptionsInTrip = tripEvents.filter(e => {
                    const eStart = new Date(e.activeFrom);
                    const eStop = new Date(e.activeTo);
                    return eStart >= tripStart && eStop <= tripStop;
                });

                let quickStops = 0;
                let totalStopTime = 0;
                let maxStop = 0;
                let stopLocations = []; 

                exceptionsInTrip.forEach(e => {
                    const durationMs = new Date(e.activeTo) - new Date(e.activeFrom);
                    const durationSecs = durationMs / 1000;
                    
                    // Duración real = duración de la excepción + OFFSET
                    const realDuration = durationSecs + OFFSET_SECONDS;

                    quickStops++;
                    totalStopTime += realDuration;
                    if (realDuration > maxStop) {
                        maxStop = realDuration;
                    }
                    
                    // Guardamos la estructura para el futuro (Fase 7 - Mapa)
                    stopLocations.push({
                        activeFrom: e.activeFrom,
                        activeTo: e.activeTo,
                        durationSecs: realDuration
                    });
                });

                // Inyectamos el análisis en el viaje
                trip._stopAnalysis = {
                    quickStops: quickStops,
                    totalStopTime: totalStopTime,
                    maxStop: maxStop,
                    stopLocations: stopLocations
                };
            });

            return trips;
        }
    };
})();


// --- risk-engine.js ---
// risk-engine.js
// Evalúa las condiciones del viaje y le asigna un Nivel de Riesgo y Puntuación

const RiskEngine = (function() {

    function getRiskLevel(score) {
        if (score <= 20) return "NORMAL";
        if (score <= 40) return "BAJO";
        if (score <= 60) return "MEDIO";
        if (score <= 80) return "ALTO";
        return "CRÍTICO";
    }

    return {
        /**
         * Calcula el riesgo de un viaje Geotab ya cruzado con APP y analizado por StopAnalyzer.
         * IMPORTANTE: las paradas se evalúan en CONJUNTO, no individualmente.
         * @param {Object} trip - El viaje enriquecido (con `matched` y `_stopAnalysis`)
         * @returns {Object} El objeto audit que se adjuntará al viaje
         */
        evaluateTrip: function(trip) {
            let score = 0;
            let reasons = [];

            const isMatched = trip.matched;
            const gDist = trip.gDist || 0; // ya en km (calculado en main.js)
            const stops = trip._stopAnalysis || { quickStops: 0, totalStopTime: 0, stopLocations: [] };

            // ── 1. BASE: No registrado en APP ───────────────────────────────────
            if (!isMatched) {
                score += 50;
                reasons.push("Viaje no registrado en la APP (+50)");
            }

            // ── 2. CANTIDAD DE PARADAS RÁPIDAS (evaluación conjunta, no acumulada) ──
            const n = stops.quickStops;
            if (n === 1) {
                score += 10;
                reasons.push(`1 parada rápida detectada (+10)`);
            } else if (n === 2) {
                score += 20;
                reasons.push(`2 paradas rápidas detectadas (+20)`);
            } else if (n >= 3 && n <= 5) {
                score += 30;
                reasons.push(`${n} paradas rápidas detectadas (+30)`);
            } else if (n > 5) {
                score += 40;
                reasons.push(`${n} paradas rápidas detectadas (+40)`);
            }

            // ── 3. PARADA MÁS LARGA (solo la peor, no acumulamos todas) ─────────
            // Se evalúa la duración de la parada MÁS LARGA del viaje para evitar inflación
            const maxStopSecs = stops.maxStop || 0;
            if (maxStopSecs > 300) { // Más de 5 min
                score += 30;
                reasons.push(`Parada máxima >5 min (${Math.round(maxStopSecs / 60)}m) (+30)`);
            } else if (maxStopSecs > 180) { // Más de 3 min
                score += 20;
                reasons.push(`Parada máxima >3 min (${Math.round(maxStopSecs / 60)}m) (+20)`);
            } else if (maxStopSecs > 90) { // 90s - 3 min
                score += 10;
                reasons.push(`Parada máxima >90s (${Math.round(maxStopSecs)}s) (+10)`);
            } else if (maxStopSecs >= 45) { // 45-90s
                score += 5;
                reasons.push(`Parada máxima 45-90s (${Math.round(maxStopSecs)}s) (+5)`);
            }

            // ── 4. TIEMPO TOTAL DETENIDO (bloque global, no por parada) ─────────
            const totalStopMin = (stops.totalStopTime || 0) / 60;
            if (totalStopMin > 15) {
                score += 20;
                reasons.push(`Tiempo total detenido >15 min (${Math.round(totalStopMin)}m) (+20)`);
            } else if (totalStopMin > 7) {
                score += 10;
                reasons.push(`Tiempo total detenido >7 min (${Math.round(totalStopMin)}m) (+10)`);
            }

            // ── 5. DISTANCIA TOTAL DEL VIAJE ─────────────────────────────────────
            if (gDist > 20) {
                score += 15;
                reasons.push(`Trayecto largo >20km (${gDist.toFixed(1)}km) (+15)`);
            } else if (gDist > 10) {
                score += 8;
                reasons.push(`Trayecto medio >10km (${gDist.toFixed(1)}km) (+8)`);
            }

            // ── 6. DIFERENCIA DE KILÓMETROS (solo si está cruzado con APP) ───────
            if (isMatched && trip.csvDist !== null && trip.csvDist !== undefined) {
                const safeGDist = gDist > 0 ? gDist : 0.1;
                const diffKm = Math.abs(gDist - trip.csvDist);
                const diffPct = (diffKm / safeGDist) * 100;

                if (diffPct > 20) {
                    score += 20;
                    reasons.push(`Diferencia de distancia >20% (APP: ${trip.csvDist}km vs Geotab: ${gDist.toFixed(1)}km) (+20)`);
                } else if (diffPct > 10) {
                    score += 10;
                    reasons.push(`Diferencia de distancia >10% (APP: ${trip.csvDist}km vs Geotab: ${gDist.toFixed(1)}km) (+10)`);
                }
            }

            const level = getRiskLevel(score);

            return {
                score: score,
                level: level,
                confidence: score, // Puntuación total visible
                reasons: reasons,
                levelClass: level === 'CRÍTICO' ? 'critico'
                          : level === 'ALTO'    ? 'alto'
                          : level === 'MEDIO'   ? 'medio'
                          : level === 'BAJO'    ? 'bajo'
                          : 'normal'
            };
        }
    };
})();

// ui.js
// Maneja todo el renderizado visual y eventos DOM

const UI = (function() {

    let currentTrips = [];
    let _targetDevices = [];

    // ── FORMATTERS ─────────────────────────────────────────────────
    function fmtDate(d) {
        if (!d) return '';
        return d.toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric'});
    }
    function fmtTime(d) {
        if (!d) return '';
        return d.toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'});
    }
    function fmtDateShort(d) {
        if (!d) return '';
        return d.toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit'});
    }
    function fmtDur(s) {
        if (!s || s === 0) return '0s';
        const m = Math.floor(s / 60);
        const sec = Math.round(s % 60);
        if (m > 0) return `${m}m ${sec > 0 ? sec + 's' : ''}`.trim();
        return `${sec}s`;
    }

    // ── DOM UTILS ───────────────────────────────────────────────────
    function showLoading(msg) {
        document.getElementById('resultsArea').innerHTML =
            `<div class="state"><div class="spinner"></div><p class="progress-msg">${msg}</p></div>`;
        document.getElementById('btnExport').style.display = 'none';
    }
    function updateLoading(msg) {
        const p = document.querySelector('.progress-msg');
        if (p) p.textContent = msg;
    }
    function showError(msg) {
        document.getElementById('resultsArea').innerHTML =
            `<div class="state"><p style="color:var(--danger)">${msg}</p></div>`;
    }

    return {

            const totalStopTimeSecs = data.reduce((acc, r) => acc + (r._stopAnalysis ? r._stopAnalysis.totalStopTime : 0), 0);
            const totalQuickStops = data.reduce((acc, r) => acc + (r._stopAnalysis ? r._stopAnalysis.quickStops : 0), 0);
            const avgRiskScore = totalGeotab > 0 ? (data.reduce((acc, r) => acc + r.audit.score, 0) / totalGeotab) : 0;

            const coveragePct = totalGeotab > 0 ? ((totalMatched / totalGeotab) * 100).toFixed(1) : 0;

            // Agrupar por vehículo
            const byPlate = {};
            data.forEach(r => {

                byPlate[r.plate].trips.push(r);

                <tbody>

                html.push(`<div class="expand-section" id="exp-${vi}">`);
                html.push(`<div class="trips-sub">`);

                if (detailTrips.length === 0) {

            html.push(`</div>`);

            document.getElementById('btnExport').style.display = 'inline-flex';
        },

        // ── EXPORT EXCEL ─────────────────────────────────────────
        exportExcel: function(csvData) {
            if (!currentTrips || currentTrips.length === 0) return;
            const suspects = currentTrips.filter(r => r.audit.level === 'ALTO' || r.audit.level === 'CRÍTICO');

            const rows = [
                ['Matrícula', 'Conductor Geotab', 'Fecha', 'Hora inicio', 'Hora fin', 'Duración (min)', 'Distancia (km)', 'Registrado APP', 'Puntuación Riesgo', 'Nivel Riesgo', 'Paradas Rápidas', 'Tiempo Total Paradas', 'Motivos'],
                ...suspects.map(r => [
                    r.plateOrig, r.geotabDriverName,
                    fmtDate(r.gStart), fmtTime(r.gStart), fmtTime(r.gStop),
                    r.gDur, r.gDist,
                    r.matched ? 'Sí' : 'No',
                    r.audit.score, r.audit.level,
                    r._stopAnalysis.quickStops,
                    fmtDur(r._stopAnalysis.totalStopTime),
                    r.audit.reasons.join(' | ')
                ])
            ];

            const wb = XLSX.utils.book_new();
            const ws1 = XLSX.utils.aoa_to_sheet(rows);
            ws1['!cols'] = [12, 25, 12, 10, 10, 12, 12, 12, 12, 10, 12, 18, 80].map(w => ({wch: w}));
            XLSX.utils.book_append_sheet(wb, ws1, 'Viajes Sospechosos');

            const today = new Date().toISOString().slice(0,10);
            XLSX.writeFile(wb, `auditoria_vtc_${today}.xlsx`);
        }
    };
})();

// main.js
// Orquestador principal y registro del Add-In en Geotab

if (typeof geotab === 'undefined') {
    window.geotab = { addin: {} };
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('resultsArea').innerHTML =
            '<div class="state"><p>Modo standalone — conecta a Geotab para datos reales.</p></div>';
    });
}

// Variables globales de sesión (necesarias para navegar al mapa)
let _globalState = null;
let _serverStr = 'my.geotab.com';
let _databaseStr = '';

// Función global para navegar al mapa — igual que en V2 validada
function navigateToTrip(event, deviceId, fromDate, toDate) {
    if (event) event.preventDefault();
    const stateStr = `tripsHistory,device:(id:${deviceId}),fromDate:${fromDate},toDate:${toDate}`;
    if (_globalState && typeof _globalState.setState === 'function') {
        _globalState.setState(stateStr);
    } else {
        const url = `https://${_serverStr}/${_databaseStr}/#${stateStr}`;
        window.open(url, '_blank');
    }
}

// Registro del addin con el key definido en el JSON
geotab.addin.blunvtcauditoria = function(api, state) {
    return {
        initialize: function(geotabApi, geotabState, callback) {
            // Guardar estado de sesión para la navegación al mapa
            _globalState = geotabState;

            // Obtener servidor y base de datos de la sesión
            geotabApi.getSession(function(session) {
                if (session) {
                    _serverStr = session.server || 'my.geotab.com';
                    _databaseStr = session.database || '';
                    const dbBadge = document.getElementById('dbNameBadge');
                    if (dbBadge) dbBadge.textContent = _databaseStr || 'blun';
                }
            });

            // Inicializar capa de datos
            DataManager.init(geotabApi);
            
            // Binding de eventos UI
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            
            // Drag & Drop
            const dropZone = document.getElementById('dropZone');
            if (dropZone) {
                dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
                dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('drag'); });
                dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('drag');
                    if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
                });
                dropZone.addEventListener('click', () => document.getElementById('fileInput').click());
            }

            document.getElementById('btnRun').addEventListener('click', runAudit);
            document.getElementById('btnExport').addEventListener('click', () => {
                UI.exportExcel(DataManager.getCsvData());
            });

            // Avisar a Geotab que estamos listos
            callback();
        },
        focus: async function(geotabApi, geotabState) {
            _globalState = geotabState;
            // Buscar la regla en background al abrir el addin
            await RuleManager.init();
        },
        blur: function() {}
    };

    function handleFileSelect(e) {
        if (e.target.files[0]) processFile(e.target.files[0]);
    }

    function processFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const stats = DataManager.parseCSV(e.target.result, file.name);
                document.getElementById('uploadLabel').innerHTML = 
                    `<strong style="color:var(--ok);">✓ ${file.name}</strong> — ${stats.tripsCount.toLocaleString('es')} viajes cargados`;
                
                // Actualizar dropdown de filtro
                const sel = document.getElementById('filterVehicle');
                sel.innerHTML = '<option value="all">Todos</option>';
                const plates = Array.from(DataManager.getCsvData().plates).sort();
                plates.forEach(p => {
                    const o = document.createElement('option');
                    o.value = p; o.textContent = p;
                    sel.appendChild(o);
                });

                document.getElementById('btnRun').disabled = false;
            } catch (err) {
                alert("Error al parsear el CSV: " + err.message);
            }
        };
        reader.readAsText(file, 'utf-8');
    }

    async function runAudit() {
        UI.showLoading("Obteniendo vehículos y usuarios...");
        
        try {
            const users = await DataManager.getUsers();
            const devicesCache = await DataManager.getDevices();
            const csvData = DataManager.getCsvData();

            // Buscar vehículos con coincidencia flexible (igual que V2)
            const csvPlates = csvData.plates;
            const targetDevices = [];
            Object.values(devicesCache.byId).forEach(d => {
                const normName  = DataManager.getNormPlate(d.name || '');
                const normPlate = DataManager.getNormPlate(d.licensePlate || '');
                const matchedCsvPlate = Array.from(csvPlates).find(p => normName.includes(p) || normPlate.includes(p));
                if (matchedCsvPlate) {
                    d._matchedCsvPlate = matchedCsvPlate;
                    targetDevices.push(d);
                }
            });

            if (targetDevices.length === 0) {
                UI.showError("No se encontraron vehículos en Geotab que coincidan con las matrículas del CSV.");
                return;
            }

            const fromDate = csvData.minDate;
            const toDate = csvData.maxDate;
            const tolerance = parseInt(document.getElementById('tolerance').value) || 5;
            const minDist = parseFloat(document.getElementById('minDist').value) || 0.5;

            // 1. Descargar Viajes
            let allTrips = [];
            for (let i=0; i<targetDevices.length; i++) {
                const dev = targetDevices[i];
                UI.updateLoading(`Descargando viajes... vehículo ${i+1}/${targetDevices.length}: ${dev.name}`);
                try {
                    const trips = await DataManager.getTrips(dev.id, fromDate, toDate);
                    trips.forEach(t => t._device = dev);
                    allTrips = allTrips.concat(trips);
                } catch(e) {
                    console.warn("Error descargando viajes del vehiculo", dev.id, e);
                }
            }

            // t.distance ya viene en km desde la API de Geotab
            const geotabFiltered = allTrips.filter(t => {
                return (t.distance || 0) >= minDist;
            });

            // 2. Motor de Paradas
            if (RuleManager.hasParadaRapidaRule()) {
                UI.updateLoading("Descargando eventos de paradas rápidas de Geotab...");
                const ruleId = RuleManager.getParadaRapidaId();
                let allEvents = [];
                try {
                    allEvents = await DataManager.getExceptionEvents(ruleId, fromDate, toDate);
                } catch (e) {
                    console.error("Error al obtener eventos", e);
                }
                
                UI.updateLoading("Calculando duraciones reales de las paradas...");
                StopAnalyzer.analyzeTrips(geotabFiltered, allEvents);
            } else {
                console.warn("No se analizan paradas porque no se encontró la regla");
                geotabFiltered.forEach(t => t._stopAnalysis = { quickStops:0, totalStopTime:0, maxStop:0, stopLocations:[]});
            }

            UI.updateLoading("Cruzando datos y calculando Índice de Confianza...");
            
            // 3. Cruce con CSV y Motor de Riesgo
            const tolMs = tolerance * 60 * 1000;
            const enriched = geotabFiltered.map(t => {
                const dev = t._device;
                // Usar la placa cruzada del dispositivo (igual que V2)
                const plate = dev._matchedCsvPlate;
                const gStart = new Date(t.start || t.startTime);
                const gStop = new Date(t.stop || t.stopTime);
                const gDist = t.distance || 0; // ya en km

                let driverName = "Sin conductor";
                if (t.driver && t.driver.id && t.driver.id !== "UnknownDriverId" && t.driver.id !== "NoDriverId") {
                    driverName = users[t.driver.id] || t.driver.id;
                }

                // Cruce con overlap (misma lógica V2 validada con matchedCSVTrips)
                const matchedCSVTrips = csvData.trips.filter(c => {
                    if (c.plate !== plate) return false;
                    const maxStart = Math.max(gStart.getTime() - tolMs, c.reqTime.getTime());
                    const minEnd   = Math.min(gStop.getTime()  + tolMs, c.arrTime.getTime());
                    return minEnd > maxStart;
                });

                const csvDist = matchedCSVTrips.length > 0
                    ? matchedCSVTrips.reduce((s, c) => s + (c.dist || 0), 0)
                    : null;

                let tripData = {
                    gId: t.id,
                    gStart: gStart, gStop: gStop,
                    gDist: +gDist.toFixed(2),
                    gDur: Math.round((gStop - gStart) / 60000),
                    plate: plate,
                    plateOrig: dev.name,
                    deviceId: dev.id,
                    deviceName: dev.name,
                    geotabDriverName: driverName,
                    matched: matchedCSVTrips.length > 0,
                    csvCount: matchedCSVTrips.length,
                    csvDist: csvDist !== null ? +csvDist.toFixed(2) : null,
                    _stopAnalysis: t._stopAnalysis
                };

                // Motor de Riesgo
                tripData.audit = RiskEngine.evaluateTrip(tripData);
                
                return tripData;
            });

            // Guardar para el filtrado sin reconsultar API
            UI._cachedData = { enriched, csvData, tolerance, minDist, targetDevices };

            // 4. Render final
            UI.renderResults(enriched, csvData, tolerance, minDist, targetDevices);

        } catch (err) {
            console.error(err);
            UI.showError("Error durante la auditoría: " + err.message);
        }
    }
};



</script>
