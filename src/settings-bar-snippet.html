<!--
  Añade este bloque dentro de tu src/vtc-comparador.html, dentro del .settings-bar,
  justo antes del <div style="margin-left:auto;..."> que contiene el botón "Comparar y Auditar".
  (En el HTML compilado que subiste, ese punto está justo antes de la línea con id="btnRun".)
-->
<div class="setting-group">
  <label>Cruce con cámara</label>
  <div style="height:34px;display:flex;align-items:center;gap:6px;">
    <input type="checkbox" id="checkCameraEvents" style="width:16px;height:16px;min-width:0;"/>
    <label for="checkCameraEvents" style="font-size:12px;font-weight:500;text-transform:none;color:var(--ink-mid);">
      Passenger.Disallowed
    </label>
  </div>
</div>
<div class="setting-group">
  <label>Tolerancia cámara (min)</label>
  <input type="number" id="cameraTolerance" value="3" min="0" step="0.5" style="width:80px;"/>
</div>
