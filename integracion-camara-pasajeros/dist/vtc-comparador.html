<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Auditoría VTC: ocupación de cámara</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body style="margin: 0; padding: 0; width: 100%; height: 100%; background-color: transparent !important; color: var(--ink);">
<style>
/* ── TOKENS ─────────────────────────────────────────── */
#vtc-app-wrapper {
  --ink:        #1a1a2e;
  --ink-mid:    #4a4a6a;
  --ink-light:  #8888aa;
  --surface:    #f7f7fb;
  --card:       #ffffff;
  --border:     #e2e2ee;
  --border-mid: #c8c8e0;
  --accent:     #3d5af1;
  --accent-dim: #e8ecfe;
  --ok:         #1a9e6e;
  --ok-dim:     #e0f5ed;
  --warn:       #d97706;
  --warn-dim:   #fef3c7;
  --danger:     #dc2626;
  --danger-dim: #fee2e2;
  --radius:     10px;
  --radius-sm:  6px;
  --shadow:     0 1px 3px rgba(0,0,40,.07), 0 4px 12px rgba(0,0,40,.05);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  color: var(--ink);
}
#vtc-app-wrapper * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ── HEADER ─────────────────────────────────────────── */
.header{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:0 24px;height:54px;display:flex;align-items:center;
  justify-content:space-between;
}
.header-left{display:flex;align-items:center;gap:10px;}
.header-logo{
  width:32px;height:32px;border-radius:8px;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
}
.header-logo svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.header h1{font-size:15px;font-weight:600;color:var(--ink);}
.header-sub{font-size:12px;color:var(--ink-light);margin-left:4px;}
.badge-db{
  background:var(--accent-dim);color:var(--accent);
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;
  letter-spacing:.03em;
}

/* ── LAYOUT ─────────────────────────────────────────── */
.main{padding:20px 24px;max-width:1380px;}

/* ── UPLOAD ZONE ────────────────────────────────────── */
.upload-zone{
  border:2px dashed var(--border-mid);border-radius:var(--radius);
  padding:36px 24px;text-align:center;cursor:pointer;
  transition:border-color .15s,background .15s;
  background:var(--card);margin-bottom:20px;
}
.upload-zone:hover,.upload-zone.drag{
  border-color:var(--accent);background:var(--accent-dim);}
.upload-zone svg{width:36px;height:36px;stroke:var(--ink-light);fill:none;
  stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px;}
.upload-zone.drag svg{stroke:var(--accent);}
.upload-zone p{color:var(--ink-mid);font-size:13px;}
.upload-zone strong{color:var(--accent);}
.upload-zone input{display:none;}

/* ── SETTINGS BAR ───────────────────────────────────── */
.settings-bar{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 18px;margin-bottom:20px;
  display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
}
.setting-group{display:flex;flex-direction:column;gap:4px;}
.setting-group label{font-size:11px;font-weight:600;color:var(--ink-light);
  text-transform:uppercase;letter-spacing:.05em;}
.setting-group input,.setting-group select{
  height:34px;border:1px solid var(--border-mid);border-radius:var(--radius-sm);
  padding:0 10px;font-size:13px;color:var(--ink);background:#fff;outline:none;
  min-width:130px;
}
.setting-group input:focus,.setting-group select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,90,241,.12);}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;
  font-weight:600;cursor:pointer;border:1px solid var(--border-mid);
  background:#fff;color:var(--ink);transition:all .12s;
}
.btn:hover{background:var(--surface);}
.btn:active{transform:scale(.98);}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#2d49e0;}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface);}

/* ── METRICS ────────────────────────────────────────── */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;margin-bottom:20px;}
.metric{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;
  display:flex;flex-direction:column;gap:4px;
}
.metric-label{font-size:11px;font-weight:600;color:var(--ink-light);
  text-transform:uppercase;letter-spacing:.05em;}
.metric-value{font-size:28px;font-weight:700;line-height:1.1;color:var(--ink);}
.metric-sub{font-size:11px;color:var(--ink-light);}
.metric.m-danger .metric-value{color:var(--danger);}
.metric.m-ok .metric-value{color:var(--ok);}
.metric.m-warn .metric-value{color:var(--warn);}
.metric.m-accent .metric-value{color:var(--accent);}

/* ── PROGRESS BAR ───────────────────────────────────── */
.coverage-bar-wrap{margin-bottom:20px;}
.coverage-label{font-size:12px;color:var(--ink-mid);margin-bottom:6px;
  display:flex;justify-content:space-between;}
.coverage-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;}
.coverage-fill{height:100%;border-radius:4px;background:var(--ok);
  transition:width .6s ease;}

/* ── TABLE CARD ─────────────────────────────────────── */
.table-card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.table-toolbar{
  padding:12px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
}
.table-title{font-size:14px;font-weight:600;color:var(--ink);}
.table-controls{display:flex;gap:8px;align-items:center;}
.search{
  height:32px;border:1px solid var(--border-mid);border-radius:var(--radius-sm);
  padding:0 10px;font-size:13px;outline:none;width:210px;color:var(--ink);
}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,90,241,.1);}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  padding:9px 14px;text-align:left;
  font-size:11px;font-weight:700;color:var(--ink-light);
  text-transform:uppercase;letter-spacing:.05em;
  background:var(--surface);border-bottom:1px solid var(--border);
  white-space:nowrap;cursor:pointer;user-select:none;
}
thead th:hover{background:#ececf6;}
thead th.sorted{color:var(--accent);}
tbody tr.vehicle-row{
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .08s;
}
tbody tr.vehicle-row:hover{background:var(--accent-dim);}
tbody tr.vehicle-row td{padding:11px 14px;font-weight:500;}

/* ── EXPAND ROWS ─────────────────────────────────────── */
.expand-section{display:none;}
.expand-section.open{display:table-row-group;}
.expand-inner td{padding:0!important;}
.trips-sub{
  background:#fafafe;border-top:1px solid var(--border);
  padding:12px 18px 16px 42px;
}
.trips-sub-title{font-size:11px;font-weight:700;color:var(--ink-light);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.trip-list{display:flex;flex-direction:column;gap:6px;}
.trip-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 14px;
  display:grid;grid-template-columns:100px 90px 90px 90px 1fr auto;
  align-items:center;gap:10px;font-size:12px;
}
.trip-item:hover{border-color:var(--accent);}
.trip-date{font-weight:600;color:var(--ink);}
.trip-time{color:var(--ink-mid);}
.trip-dist{font-weight:600;color:var(--accent);}
.trip-dur{color:var(--ink-mid);}
.trip-route{color:var(--ink-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:11px;}
.trip-actions{display:flex;gap:6px;}
.trip-link{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:4px;font-size:11px;font-weight:600;
  background:var(--accent-dim);color:var(--accent);
  text-decoration:none;border:1px solid transparent;
  transition:background .1s;
}
.trip-link:hover{background:#d5dcfc;}

/* ── PILLS ───────────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;padding:2px 8px;
  border-radius:20px;font-size:11px;font-weight:600;}
.pill-ok{background:var(--ok-dim);color:var(--ok);}
.pill-warn{background:var(--warn-dim);color:var(--warn);}
.pill-danger{background:var(--danger-dim);color:var(--danger);}
.pill-neutral{background:var(--surface);color:var(--ink-light);border:1px solid var(--border);}

/* ── MINI BAR ────────────────────────────────────────── */
.mini-bar{display:flex;align-items:center;gap:6px;}
.mini-bar-bg{width:80px;height:5px;background:var(--border);border-radius:3px;}
.mini-bar-fill{height:100%;border-radius:3px;}

/* ── STATE ───────────────────────────────────────────── */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;gap:12px;color:var(--ink-light);}
.state svg{width:44px;height:44px;stroke:var(--border-mid);fill:none;
  stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;}
.state p{font-size:13px;text-align:center;max-width:320px;line-height:1.6;}
.spinner{width:32px;height:32px;border:2.5px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .65s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.progress-msg{font-size:12px;color:var(--ink-mid);text-align:center;margin-top:6px;}

/* ── INFO BAR ────────────────────────────────────────── */
.info-bar{
  background:var(--accent-dim);border:1px solid #c5d0fa;
  border-radius:var(--radius-sm);padding:9px 14px;margin-bottom:16px;
  font-size:12px;color:var(--accent);display:flex;align-items:center;gap:8px;
}
.info-bar svg{width:14px;height:14px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

/* ── TABLE FOOTER ────────────────────────────────────── */
.table-footer{
  padding:10px 18px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--ink-light);
}

/* ── MODAL ───────────────────────────────────────────── */
#modalContainer { display: none; }
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,40,0.6); backdrop-filter: blur(4px);
  z-index: 9998; display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s ease;
}
.modal-overlay.show { opacity: 1; }
.modal-box {
  background: var(--surface); width: 900px; max-width: 95vw; max-height: 90vh;
  border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 10px 40px rgba(0,0,40,0.2); transform: translateY(20px) scale(0.98);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-overlay.show .modal-box { transform: translateY(0) scale(1); }
.modal-header {
  padding: 20px 24px; background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-title { font-size: 18px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 10px; }
.modal-close {
  background: none; border: none; cursor: pointer; padding: 6px;
  border-radius: 6px; transition: background 0.15s;
}
.modal-close:hover { background: var(--surface); color: var(--danger); }
.modal-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
.modal-body {
  padding: 24px; overflow-y: auto; flex: 1;
}
.modal-grid {
  display: grid; grid-template-columns: 320px 1fr; gap: 20px;
}
.modal-sidebar { display: flex; flex-direction: column; gap: 20px; }

/* ── HEATMAP ─────────────────────────────────────────── */
.heatmap-wrapper {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 24px; margin-bottom: 20px; box-shadow: var(--shadow);
}
.heatmap-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--ink); }
.heatmap-layout { display: flex; }
.heatmap-y-labels { display: flex; flex-direction: column; justify-content: space-around; padding-right: 10px; color: var(--ink-mid); font-size: 11px; font-weight: 500; }
.heatmap-x-labels { display: flex; margin-left: 36px; margin-bottom: 6px; color: var(--ink-mid); font-size: 10px; }
.heatmap-x-label { flex: 1; text-align: center; }
.heatmap-grid {
  display: grid; flex: 1; grid-template-columns: repeat(24, 1fr); grid-template-rows: repeat(7, 1fr); gap: 2px;
}
.hm-cell {
  background: var(--surface); border-radius: 2px; height: 16px; min-width: 10px;
  transition: transform 0.1s; position: relative;
}
.hm-cell:hover { transform: scale(1.4); z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.hm-cell::after {
  content: attr(title); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; padding: 4px 8px; font-size: 10px; border-radius: 4px;
  white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.2s;
}
.hm-cell:hover::after { opacity: 1; }

/* ── PDF EXPORT MODE ─────────────────────────────────── */
body.pdf-mode {
  background: white !important;
  /* El ancho fijo ayuda a que html2pdf encaje bien en A4 */
  width: 1024px !important; 
  margin: 0 auto;
}
body.pdf-mode .settings-bar,
body.pdf-mode .upload-zone,
body.pdf-mode #btnExport,
body.pdf-mode #btnExportPDF,
body.pdf-mode .table-toolbar {
  display: none !important;
}
body.pdf-mode .main {
  padding: 10px 0;
}
body.pdf-mode .metric,
body.pdf-mode .table-card {
  box-shadow: none !important;
  border: 1px solid #ccc !important;
}
body.pdf-mode tr.vehicle-row,
body.pdf-mode .expand-section.open {
  page-break-inside: avoid;
}
body.pdf-mode .header {
  padding: 0;
  border-bottom: 2px solid #eee;
}
body.pdf-mode .metric-value {
  font-size: 24px;
}

</style>

<script>
// --- data-manager.js ---
// data-manager.js
// Maneja toda la comunicación con Geotab, el parseo del CSV y el estado de los datos

const DataManager = (function() {
    let api = null;
    
    // Caché de entidades
    let cache = {
        users: null,
        devices: null,
        rules: null
    };

    // Estado del CSV
    let csvData = {
        trips: [],
        plates: new Set(),
        minDate: null,
        maxDate: null,
        dateRanges: []  // Rangos de fechas individuales por CSV para filtro preciso
    };

    // ── NORMALIZAR MATRÍCULA ─────────────────────────────────
    function normPlate(p) {
        return String(p || '').replace(/[\s\-]/g, '').toUpperCase().trim();
    }

    // ── PARSEAR FECHA DD/MM/YYYY HH:MM ───────────────────────
    function parseDate(s) {
        if (!s) return null;
        const m = s.match(/(\d{1,2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})/);
        if (!m) return null;
        return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]);
    }

    // ── WRAPPER API ──────────────────────────────────────────
    function callApi(method, params) {
        return new Promise((resolve, reject) => {
            if (!api) return reject(new Error("API no inicializada"));
            api.call(method, params, resolve, reject);
        });
    }

    // ── PARSERS ESPECÍFICOS POR APP ──────────────────────────
    function parseUberCSV(lines, idx) {
        const trips = [];
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(';');
            const estado = (cols[idx['Estado del viaje']] || '').trim();
            if (estado !== 'completed') continue;

            const plate = normPlate(cols[idx['Matrícula']]);
            const reqStr = (cols[idx['Hora de la solicitud del viaje']] || '').trim();
            const arrStr = (cols[idx['Hora de llegada del viaje']] || '').trim();
            if (!plate || !reqStr || !arrStr) continue;

            trips.push({
                uuid: cols[idx['UUID del viaje']],
                conductor: (cols[idx['Nombre del conductor']] || '') + ' ' + (cols[idx['Apellido del conductor']] || ''),
                plate: plate,
                plateRaw: cols[idx['Matrícula']],
                reqTime: parseDate(reqStr),
                arrTime: parseDate(arrStr),
                origin:  cols[idx['Dirección de recogida']] || '',
                dest:    cols[idx['Dirección de destino']] || '',
                dist:    parseFloat((cols[idx['Distancia del viaje']] || '0').replace(',','.')),
                product: cols[idx['Tipo de producto']] || '',
                payment: cols[idx['Tipo de pago']] || '',
                status: estado,
                appType: 'uber'
            });
        }
        return trips;
    }

    function parseBoltCSV(lines, idx) {
        const trips = [];
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(';');
            const estado = (cols[idx['Estado']] || '').trim();
            
            // Requerimiento: Analizar "Terminado" y "Cancelación del conductor"
            if (estado !== 'Terminado' && estado !== 'Cancelación del conductor') continue;

            const plate = normPlate(cols[idx['Matrícula']]);
            const reqStr = (cols[idx['Fecha']] || '').trim(); 
            const arrStr = (cols[idx['Tarifa finalizada']] || '').trim(); 

            if (!plate || !reqStr) continue;

            let reqTimeParsed = parseDate(reqStr);
            let arrTimeParsed = parseDate(arrStr);
            if (!reqTimeParsed) continue;
            
            // Si no hay hora de llegada (por cancelación), estimamos una ventana de 30 mins
            // para que el motor de riesgo pueda buscar viajes de Geotab en esa franja.
            if (!arrTimeParsed) {
                arrTimeParsed = new Date(reqTimeParsed.getTime() + 30 * 60000);
            }

            let ruta = cols[idx['Ruta']] || '';
            let origin = ruta.split('→')[0] ? ruta.split('→')[0].trim() : '';
            let dest = ruta.split('→')[1] ? ruta.split('→')[1].trim() : '';

            trips.push({
                uuid: cols[idx['Identificador individual']],
                conductor: cols[idx['Conductor']] || '',
                plate: plate,
                plateRaw: cols[idx['Matrícula']],
                reqTime: reqTimeParsed,
                arrTime: arrTimeParsed,
                origin:  origin,
                dest:    dest,
                dist:    parseFloat((cols[idx['Distancia|km']] || '0').replace(',','.')),
                product: cols[idx['Categoría']] || '',
                payment: cols[idx['Forma de pago']] || '', // "Efectivo" o "En app"
                status: estado,
                appType: 'bolt'
            });
        }
        return trips;
    }

    return {
        init: function(geotabApi) {
            api = geotabApi;
        },

        // ... (caché methods keep as is) ...
        getUsers: async function() {
            if (cache.users) return cache.users;
            const users = await callApi('Get', { typeName: 'User', resultsLimit: 5000 });
            cache.users = {};
            users.forEach(u => {
                cache.users[u.id] = (u.firstName && u.lastName) ? (u.firstName + ' ' + u.lastName) : (u.name || 'Desconocido');
            });
            return cache.users;
        },

        getDevices: async function() {
            if (cache.devices) return cache.devices;
            const devices = await callApi('Get', { typeName: 'Device', resultsLimit: 2000 });
            cache.devices = {
                byId: {},
                byPlate: {} // Mapeo de matrícula normalizada a device
            };
            devices.forEach(d => {
                cache.devices.byId[d.id] = d;
                const np = normPlate(d.name);
                if (np) cache.devices.byPlate[np] = d;
            });
            return cache.devices;
        },

        getRules: async function() {
            if (cache.rules) return cache.rules;
            const rules = await callApi('Get', { typeName: 'Rule', resultsLimit: 5000 });
            cache.rules = rules;
            return cache.rules;
        },

        getTripsAndExceptionsBatch: async function(requests, ruleId, batchSize, onProgress) {
            const output = {};
            const size = Math.max(1, Math.min(batchSize || 50, 50));
            for (let offset = 0; offset < requests.length; offset += size) {
                const batch = requests.slice(offset, offset + size);
                const calls = [];
                batch.forEach(request => {
                    calls.push(['Get', { typeName: 'Trip', search: {
                        fromDate: request.fromDate, toDate: request.toDate, deviceSearch: { id: request.device.id }
                    }, resultsLimit: 50000 }]);
                    if (ruleId) calls.push(['Get', { typeName: 'ExceptionEvent', search: {
                        ruleSearch: { id: ruleId }, deviceSearch: { id: request.device.id },
                        fromDate: request.fromDate, toDate: request.toDate
                    }, resultsLimit: 50000 }]);
                });
                if (onProgress) onProgress(Math.min(offset + batch.length, requests.length), requests.length);
                try {
                    const results = await new Promise((resolve, reject) => {
                        if (!api || typeof api.multiCall !== 'function') return reject(new Error('Geotab API multiCall no disponible.'));
                        api.multiCall(calls, resolve, reject);
                    });
                    batch.forEach((request, index) => {
                        const stride = ruleId ? 2 : 1;
                        output[request.device.id] = {
                            trips: Array.isArray(results[index * stride]) ? results[index * stride] : [],
                            exceptions: ruleId && Array.isArray(results[index * stride + 1]) ? results[index * stride + 1] : [],
                            error: null
                        };
                    });
                } catch (batchError) {
                    // If a MultiCall is rejected, fall back per device so diagnostics remain specific.
                    const fallback = await Promise.all(batch.map(async request => {
                        try {
                            const trips = await this.getTrips(request.device.id, request.fromDate, request.toDate);
                            const exceptions = ruleId ? await this.getExceptionEvents(ruleId, request.device.id, request.fromDate, request.toDate) : [];
                            return { id: request.device.id, trips, exceptions, error: null };
                        } catch (error) {
                            return { id: request.device.id, trips: [], exceptions: [], error: error.message || batchError.message };
                        }
                    }));
                    fallback.forEach(result => { output[result.id] = result; });
                }
            }
            return output;
        },
        getTrips: async function(deviceId, fromDate, toDate) {
            return await callApi('Get', {
                typeName: 'Trip',
                search: {
                    fromDate: fromDate,
                    toDate: toDate,
                    deviceSearch: { id: deviceId }
                },
                resultsLimit: 50000
            });
        },

        getExceptionEvents: async function(ruleId, deviceId, fromDate, toDate) {
            return await callApi('Get', {
                typeName: 'ExceptionEvent',
                search: {
                    ruleSearch: { id: ruleId },
                    deviceSearch: { id: deviceId },
                    fromDate: fromDate,
                    toDate: toDate
                },
                resultsLimit: 50000
            });
        },

        // ── GESTIÓN DE CSV MÚLTIPLES Y AUTO-DETECCIÓN ────────────────────────
        parseMultipleCSVs: function(filesData) {
            if (!filesData || filesData.length === 0) throw new Error("No hay archivos para procesar.");
            
            let allTrips = [];
            // Guardamos el rango de fechas de CADA archivo por separado
            const dateRanges = [];
            
            filesData.forEach(file => {
                let text = file.text.replace(/^\uFEFF/, '');
                const lines = text.split(/\r?\n/).filter(l => l.trim());
                if (lines.length < 2) {
                    console.warn(`El archivo ${file.name} está vacío o no es válido.`);
                    return;
                }

                // Auto-detección por cabeceras
                const headerLine = lines[0];
                const header = headerLine.split(';');
                const idx = {};
                header.forEach((h, i) => { idx[h.trim()] = i; });

                let appType = 'unknown';
                if (idx['UUID del viaje'] !== undefined || headerLine.includes('UUID del viaje') || headerLine.includes('Estado del viaje')) {
                    appType = 'uber';
                } else if (idx['Identificador individual'] !== undefined || headerLine.includes('Identificador individual') || headerLine.includes('Tarifa finalizada')) {
                    appType = 'bolt';
                }

                let trips = [];
                if (appType === 'uber') {
                    trips = parseUberCSV(lines, idx);
                } else if (appType === 'bolt') {
                    trips = parseBoltCSV(lines, idx);
                } else {
                    console.warn(`No se pudo detectar el formato de ${file.name}. Formato no reconocido.`);
                    return; // Skip este archivo
                }
                
                if (trips.length > 0) {
                    // Calcular y guardar el rango de fechas específico de este archivo
                    const fileDates = trips.map(t => t.reqTime).filter(Boolean);
                    const fileMin = new Date(Math.min(...fileDates));
                    const fileMax = new Date(Math.max(...fileDates));
                    fileMin.setHours(0, 0, 0, 0);
                    fileMax.setHours(23, 59, 59, 999);
                    
                    const platesInFile = new Set(trips.map(t => t.plate));
                    dateRanges.push({ min: fileMin, max: fileMax, plates: platesInFile });
                }

                trips.forEach(t => t.appSource = appType);
                allTrips = allTrips.concat(trips);
            });

            if (allTrips.length === 0) throw new Error("No se encontraron viajes válidos en los archivos cargados.");

            const allDates = allTrips.map(t => t.reqTime).filter(Boolean);
            const minDate = new Date(Math.min(...allDates));
            const maxDate = new Date(Math.max(...allDates));
            minDate.setHours(0,0,0,0);
            maxDate.setHours(23,59,59,999);

            csvData.trips = allTrips;
            csvData.plates = new Set(allTrips.map(t => t.plate));
            csvData.minDate = minDate.toISOString();
            csvData.maxDate = maxDate.toISOString();
            // ✔ Guardamos los rangos individuales para filtrar Geotab después
            csvData.dateRanges = dateRanges;

            return {
                tripsCount: allTrips.length,
                platesCount: csvData.plates.size,
                minDate: minDate,
                maxDate: maxDate
            };
        },

        getCsvData: function() {
            return csvData;
        },
        
        getNormPlate: function(plate) {
            return normPlate(plate);
        }
    };
})();

// --- stop-analyzer.js ---
// stop-analyzer.js
// Analiza las excepciones (Paradas Rápidas) y calcula tiempos reales

const StopAnalyzer = (function() {
    
    // Constante de tiempo a sumar por cada excepción (tiempo que tarda la regla en saltar)
    const OFFSET_SECONDS = 45;

    return {
        /**
         * Cruza los viajes de Geotab con los eventos de excepción
         * @param {Array} trips - Array de viajes Geotab (raw)
         * @param {Array} exceptionEvents - Array de eventos de la regla Parada Rápida
         */
        analyzeTrips: function(trips, exceptionEvents) {
            // Pre-agrupar excepciones por ID de vehículo para acelerar la búsqueda
            const eventsByDevice = {};
            exceptionEvents.forEach(e => {
                const devId = e.device.id;
                if (!eventsByDevice[devId]) eventsByDevice[devId] = [];
                eventsByDevice[devId].push(e);
            });

            // Analizar cada viaje
            trips.forEach(trip => {
                const devId = trip.device ? trip.device.id : trip._device.id;
                const tripEvents = eventsByDevice[devId] || [];
                const tripStart = new Date(trip.start || trip.startTime);
                const tripStop = new Date(trip.stop || trip.stopTime);

                // Filtrar las excepciones que ocurrieron DURANTE este viaje
                const exceptionsInTrip = tripEvents.filter(e => {
                    const eStart = new Date(e.activeFrom);
                    const eStop = new Date(e.activeTo);
                    return eStart >= tripStart && eStop <= tripStop;
                });

                let quickStops = 0;
                let totalStopTime = 0;
                let maxStop = 0;
                let stopLocations = []; 

                exceptionsInTrip.forEach(e => {
                    const durationMs = new Date(e.activeTo) - new Date(e.activeFrom);
                    const durationSecs = durationMs / 1000;
                    
                    // Duración real = duración de la excepción + OFFSET
                    const realDuration = durationSecs + OFFSET_SECONDS;

                    quickStops++;
                    totalStopTime += realDuration;
                    if (realDuration > maxStop) {
                        maxStop = realDuration;
                    }
                    
                    // Guardamos la estructura para el futuro (Fase 7 - Mapa)
                    stopLocations.push({
                        activeFrom: e.activeFrom,
                        activeTo: e.activeTo,
                        durationSecs: realDuration
                    });
                });

                // Inyectamos el análisis en el viaje
                trip._stopAnalysis = {
                    quickStops: quickStops,
                    totalStopTime: totalStopTime,
                    maxStop: maxStop,
                    stopLocations: stopLocations
                };
            });

            return trips;
        }
    };
})();


// --- passenger-camera.js ---
// Consulta en bloque CameraEvent y conserva diagnóstico de asociación/cobertura por vehículo.
const PassengerCamera = (function() {
    const EVENT_TYPE = 'Passenger.Disallowed';
    let api = null;
    let sessionPromise = null;
    let camerasPromise = null;

    function normalizeSerial(value) { return String(value || '').trim().toUpperCase(); }
    function getSession() {
        if (!sessionPromise) sessionPromise = new Promise((resolve, reject) => {
            if (!api) return reject(new Error('API no inicializada'));
            api.getSession(session => session ? resolve(session) : reject(new Error('Sesión Geotab no disponible')));
        });
        return sessionPromise;
    }
    async function rawApiCall(method, params) {
        const session = await getSession();
        const response = await fetch('https://' + (session.server || 'my.geotab.com') + '/apiv1', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ method, params: Object.assign({}, params, {
                credentials: { database: session.database, userName: session.userName, sessionId: session.sessionId }
            }) })
        });
        if (!response.ok) throw new Error('HTTP ' + response.status + ' consultando ' + method);
        const payload = await response.json();
        if (payload.error) throw new Error(payload.error.message || JSON.stringify(payload.error));
        return payload.result;
    }
    async function getCameras() {
        if (!camerasPromise) camerasPromise = rawApiCall('Get', { typeName: 'Camera', resultsLimit: 5000 });
        return camerasPromise;
    }
    function segmentsForTrip(trip, quickStops, toleranceMs) {
        const start = new Date(trip.start || trip.startTime).getTime();
        const stop = new Date(trip.stop || trip.stopTime).getTime();
        const stops = quickStops.filter(s => {
            const at = new Date(s.activeFrom).getTime(); return at >= start && at <= stop;
        }).sort((a, b) => new Date(a.activeFrom) - new Date(b.activeFrom));
        const segments = []; let cursor = start;
        stops.forEach(s => {
            const from = new Date(s.activeFrom).getTime(), to = new Date(s.activeTo).getTime();
            if (from > cursor) segments.push({ from: cursor, to: from });
            cursor = Math.max(cursor, to);
        });
        if (cursor < stop) segments.push({ from: cursor, to: stop });
        if (!segments.length && stop >= start) segments.push({ from: start, to: stop });
        return segments.map(s => ({ from: s.from - toleranceMs, to: s.to + toleranceMs }));
    }

    return {
        init: function(geotabApi) { api = geotabApi; },
        fetchForDevices: async function(devices, fromDate, toDate) {
            const eventsByDevice = {};
            const diagnosticsByDevice = {};
            const candidateCameras = [];
            (devices || []).forEach(device => {
                eventsByDevice[device.id] = [];
                diagnosticsByDevice[device.id] = {
                    deviceId: device.id, deviceName: device.name || device.id,
                    deviceSerialNumber: device.serialNumber || '', cameraSerialNumber: '',
                    status: 'pending', reason: '', eventsReceived: 0
                };
                if (!device.serialNumber) {
                    diagnosticsByDevice[device.id].status = 'missing_device_serial';
                    diagnosticsByDevice[device.id].reason = 'El objeto Device no incluye serialNumber.';
                }
            });

            let cameras;
            try { cameras = await getCameras(); }
            catch (error) {
                Object.values(diagnosticsByDevice).forEach(d => {
                    if (d.status === 'pending') { d.status = 'camera_catalog_error'; d.reason = error.message; }
                });
                return { eventsByDevice, diagnosticsByDevice };
            }

            const cameraByDeviceSerial = new Map();
            (cameras || []).forEach(camera => {
                const key = normalizeSerial(camera.deviceSerialNumber);
                if (key && !cameraByDeviceSerial.has(key)) cameraByDeviceSerial.set(key, camera);
            });
            (devices || []).forEach(device => {
                const diagnostic = diagnosticsByDevice[device.id];
                if (diagnostic.status !== 'pending') return;
                const camera = cameraByDeviceSerial.get(normalizeSerial(device.serialNumber));
                if (!camera) {
                    diagnostic.status = 'camera_not_linked';
                    diagnostic.reason = 'No hay Camera.deviceSerialNumber que coincida con Device.serialNumber.';
                    return;
                }
                if (!camera.cameraSerialNumber) {
                    diagnostic.status = 'camera_serial_missing';
                    diagnostic.reason = 'La entidad Camera no incluye cameraSerialNumber.';
                    return;
                }
                diagnostic.cameraSerialNumber = camera.cameraSerialNumber;
                diagnostic.status = 'pending_events';
                candidateCameras.push({ deviceId: device.id, cameraSerialNumber: camera.cameraSerialNumber });
            });

            if (!candidateCameras.length) return { eventsByDevice, diagnosticsByDevice };
            const serials = Array.from(new Set(candidateCameras.map(c => c.cameraSerialNumber)));
            const deviceById = new Set(candidateCameras.map(c => c.deviceId));
            try {
                const baseSearch = { cameraSerialNumbers: serials, eventTypeFilter: [{ eventType: EVENT_TYPE }] };
                const limit = 500;
                const maxDepth = 12;
                const uniqueEvents = new Map();
                async function fetchCompleteRange(fromMs, toMs, depth) {
                    const search = Object.assign({}, baseSearch, {
                        fromDate: new Date(fromMs).toISOString(),
                        toDate: new Date(toMs).toISOString()
                    });
                    const batch = await rawApiCall('Get', { typeName: 'CameraEvent', search, resultsLimit: limit });
                    if (!batch || !batch.length) return;
                    if (batch.length >= limit) {
                        if (depth >= maxDepth || toMs - fromMs <= 1000) {
                            throw new Error('Hay demasiados eventos incluso en un intervalo de un segundo; reduce el período o selecciona menos vehículos.');
                        }
                        const middle = Math.floor((fromMs + toMs) / 2);
                        await fetchCompleteRange(fromMs, middle, depth + 1);
                        await fetchCompleteRange(middle + 1, toMs, depth + 1);
                        return;
                    }
                    batch.forEach(event => uniqueEvents.set(event.id || [
                        event.cameraSerialNumber, event.deviceId, event.eventStart, event.eventType
                    ].join('|'), event));
                }
                const fromMs = new Date(fromDate).getTime();
                const toMs = new Date(toDate).getTime();
                await fetchCompleteRange(fromMs, toMs, 0);
                const allEvents = Array.from(uniqueEvents.values());
                allEvents.forEach(event => {
                    if (event.eventType === EVENT_TYPE && deviceById.has(event.deviceId)) eventsByDevice[event.deviceId].push(event);
                });
                candidateCameras.forEach(camera => {
                    const diagnostic = diagnosticsByDevice[camera.deviceId];
                    diagnostic.status = 'ok';
                    diagnostic.eventsReceived = eventsByDevice[camera.deviceId].length;
                });
            } catch (error) {
                candidateCameras.forEach(camera => {
                    const diagnostic = diagnosticsByDevice[camera.deviceId];
                    diagnostic.status = 'camera_event_error';
                    diagnostic.reason = error.message;
                });
            }
            return { eventsByDevice, diagnosticsByDevice };
        },
        analyzeTrips: function(trips, cameraResult, quickStops, toleranceMs) {
            const eventsByDevice = cameraResult.eventsByDevice || {};
            const diagnostics = cameraResult.diagnosticsByDevice || {};
            trips.forEach(trip => {
                const deviceId = trip._device.id;
                const diagnostic = diagnostics[deviceId] || { status: 'camera_not_queried', reason: 'No se consultó esta cámara.', eventsReceived: 0 };
                const available = diagnostic.status === 'ok';
                const segments = segmentsForTrip(trip, quickStops, toleranceMs);
                const events = (eventsByDevice[deviceId] || []).filter(event => {
                    const at = new Date(event.eventStart).getTime();
                    return segments.some(segment => at >= segment.from && at <= segment.to);
                });
                trip._passengerAnalysis = {
                    available, status: diagnostic.status, unavailableReason: diagnostic.reason || null,
                    events, receivedEvents: eventsByDevice[deviceId] || [],
                    hasPassenger: available && events.length > 0, segmentsCount: segments.length
                };
            });
            return trips;
        }
    };
})();

// --- risk-engine.js ---
// Clasifica únicamente la discrepancia principal acordada: ocupación de cámara sin viaje CSV.
const RiskEngine = (function() {
    return {
        evaluateTrip: function(trip) {
            const passenger = trip._passengerAnalysis || { hasPassenger: false, events: [] };
            const unregisteredOccupancy = trip.hasCsv && passenger.hasPassenger && !trip.matched;
            const reasons = [];
            if (unregisteredOccupancy) {
                reasons.push(`Passenger.Disallowed: ${passenger.events.length} evento(s) y ningún viaje CSV coincidente.`);
            } else if (passenger.hasPassenger) {
                reasons.push(`Passenger.Disallowed: ${passenger.events.length} evento(s), con viaje CSV coincidente.`);
            } else if (passenger.available === false) {
                reasons.push(`Consulta de cámara no disponible: ${passenger.unavailableReason || 'sin datos'}.`);
            }
            return {
                score: unregisteredOccupancy ? 100 : 0,
                level: unregisteredOccupancy ? 'REVISAR' : 'NORMAL',
                confidence: unregisteredOccupancy ? 100 : 0,
                reasons,
                fraudAlert: unregisteredOccupancy ? 'OCUPACIÓN DETECTADA SIN REGISTRO CSV' : null,
                levelClass: unregisteredOccupancy ? 'alto' : 'normal'
            };
        }
    };
})();

// --- ui.js ---
// ui.js
// Maneja todo el renderizado visual y eventos DOM

const UI = (function() {

    let currentTrips = [];
    let _targetDevices = [];
    let _chartInstances = []; // To store Chart.js instances for cleanup

    // ── FORMATTERS ─────────────────────────────────────────────────
    function fmtDate(d) {
        if (!d) return '';
        return d.toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric'});
    }
    function fmtTime(d) {
        if (!d) return '';
        return d.toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'});
    }
    function fmtDateShort(d) {
        if (!d) return '';
        return d.toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit'});
    }
    function fmtDur(s) {
        if (!s || s === 0) return '0s';
        const m = Math.floor(s / 60);
        const sec = Math.round(s % 60);
        if (m > 0) return `${m}m ${sec > 0 ? sec + 's' : ''}`.trim();
        return `${sec}s`;
    }

    // ── DOM UTILS ───────────────────────────────────────────────────
    function showLoading(msg) {
        document.getElementById('resultsArea').innerHTML =
            `<div class="state"><div class="spinner"></div><p class="progress-msg">${msg}</p></div>`;
        const btnExp = document.getElementById('btnExport');
        const btnPdf = document.getElementById('btnExportPDF');
        if (btnExp) btnExp.style.display = 'none';
        if (btnPdf) btnPdf.style.display = 'none';
    }
    function updateLoading(msg) {
        const p = document.querySelector('.progress-msg');
        if (p) p.textContent = msg;
    }
    function showError(msg) {
        document.getElementById('resultsArea').innerHTML =
            `<div class="state"><p style="color:var(--danger)">${msg}</p></div>`;
    }

    return {
        showLoading, updateLoading, showError,
        _cachedData: null,

        // ── RENDER PRINCIPAL ─────────────────────────────────────
        renderResults: function(trips, periodData, tolerance, cameraTolerance, targetDevices, hasCsv, cameraResult) {
            currentTrips = trips;
            if (targetDevices) _targetDevices = targetDevices;
            const filter = document.getElementById('filterVehicle');
            const data = filter && filter.value !== 'all' ? trips.filter(t => t.deviceId === filter.value) : trips;
            const diagnosticsMap = cameraResult && cameraResult.diagnosticsByDevice || {};
            const visibleDiagnostics = Object.values(diagnosticsMap).filter(d => !filter || filter.value === 'all' || d.deviceId === filter.value);
            const occupied = data.filter(t => t._passengerAnalysis && t._passengerAnalysis.hasPassenger);
            const noEvent = data.filter(t => t._passengerAnalysis && t._passengerAnalysis.available && !t._passengerAnalysis.hasPassenger);
            const registered = occupied.filter(t => t.matched);
            const frauds = hasCsv ? occupied.filter(t => !t.matched) : [];
            const eventMap = new Map();
            Object.entries(cameraResult && cameraResult.eventsByDevice || {}).forEach(([deviceId, events]) => events.forEach(e => {
                const key = `${deviceId}:${e.id || e.eventStart}`;
                if (!eventMap.has(key)) eventMap.set(key, e);
            }));
            const byVehicle = new Map();
            visibleDiagnostics.forEach(d => byVehicle.set(d.deviceId, { name: d.deviceName, trips: [], deviceId: d.deviceId, diagnostic: d }));
            data.forEach(t => {
                const key = t.deviceId;
                if (!byVehicle.has(key)) byVehicle.set(key, { name: t.plateOrig || t.deviceName, trips: [], deviceId: key, diagnostic: diagnosticsMap[key] });
                byVehicle.get(key).trips.push(t);
            });

                    Período: ${period} · ${data.length} viajes Geotab · ${visibleDiagnostics.length} vehículos · ${okCameraCount} cámaras consultadas OK · ${issueDiagnostics.length} incidencias · ${hasCsv ? `CSV ±${tolerance} min` : 'sin CSV'} · Cámara ±${document.getElementById('cameraTolerance').value} min · ${periodData.elapsedSeconds || 0}s

        // ── GENERATE HEATMAP ─────────────────────────────────────
        generateHeatmap: function(trips, title) {
            const map = Array(7).fill(0).map(() => Array(24).fill(0));
            let maxCount = 0;
            
            trips.forEach(t => {
                const firstEvent = t._passengerAnalysis && t._passengerAnalysis.events && t._passengerAnalysis.events[0];
                const date = firstEvent ? new Date(firstEvent.eventStart) : t.gStart;
                let day = date.getDay() - 1;
                if (day === -1) day = 6;
                const hour = date.getHours();
                map[day][hour]++;
                if (map[day][hour] > maxCount) maxCount = map[day][hour];
            });

            const days = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
            let gridHtml = '';
            for (let d = 0; d < 7; d++) {
                for (let h = 0; h < 24; h++) {
                    const count = map[d][h];
                    const intensity = maxCount > 0 ? (count / maxCount) : 0;
                    let bg = 'var(--surface)';
                    if (count > 0) {
                        const alpha = 0.15 + (intensity * 0.85);
                        bg = `rgba(220, 38, 38, ${alpha})`;
                    }
                    const tooltip = `${days[d]} ${h.toString().padStart(2,'0')}:00 - ${count} casos: ${title.toLowerCase()}`;
                    gridHtml += `<div class="hm-cell" style="background:${bg};" title="${tooltip}"></div>`;
                }
            }

            let xLabels = '';
            for (let h = 0; h < 24; h+=2) {
                xLabels += `<div class="heatmap-x-label">${h}h</div>`;
            }

            return `
            <div class="heatmap-wrapper">
                <div class="heatmap-title">Mapa de calor: ${title}</div>
                <div class="heatmap-layout">
                    <div class="heatmap-y-labels">
                        ${days.map(d => `<span>${d}</span>`).join('')}
                    </div>
                    <div style="flex:1; display:flex; flex-direction:column;">
                        <div class="heatmap-grid">${gridHtml}</div>
                        <div class="heatmap-x-labels">${xLabels}</div>
                    </div>
                </div>
            </div>`;
        },

        // ── EXPORT EXCEL ─────────────────────────────────────────
        exportExcel: function() {
            const frauds = currentTrips.filter(t => t._passengerAnalysis && t._passengerAnalysis.hasPassenger && !t.matched);

                ...frauds.map(t => [t.plateOrig, fmtDate(t.gStart), fmtTime(t.gStart), fmtTime(t.gStop),
                    t._passengerAnalysis.events.length, t._stopAnalysis ? t._stopAnalysis.quickStops : 0, 'Sin coincidencia'])
            ];
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(rows);
            XLSX.utils.book_append_sheet(wb, ws, 'Ocupación sin registro');
            XLSX.writeFile(wb, `ocupacion_sin_registro_${new Date().toISOString().slice(0,10)}.xlsx`);
        },
        // ── EXPORT PDF ───────────────────────────────────────────
        exportPDF: function(csvData) {
            if (typeof html2pdf === 'undefined') {
                console.error("La librería html2pdf.js no está cargada.");
                alert("Error al cargar la librería de exportación a PDF.");
                return;
            }

            // Añadir clase para modo impresión (ocultar botones, ajustes CSS)
            document.body.classList.add('pdf-mode');

            // CERRAR todos los desplegables de vehículos para que el PDF sea un reporte ejecutivo (evita cuelgues por DOM gigante)
            document.querySelectorAll('.expand-section').forEach(el => el.classList.remove('open'));

            const element = document.getElementById('vtc-app-wrapper');
            const today = new Date().toISOString().slice(0,10);
            
            const opt = {
                margin:       10,
                filename:     `auditoria_vtc_${today}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                // Quitar clase de impresión
                document.body.classList.remove('pdf-mode');
            }).catch(err => {
                console.error("Error generando PDF", err);
                document.body.classList.remove('pdf-mode');

    function initCharts(matched, unmatched, vehicles) {

// main.js
// Orquestador principal y registro del Add-In en Geotab

if (typeof geotab === 'undefined') {
    window.geotab = { addin: {} };
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('resultsArea').innerHTML =
            '<div class="state"><p>Modo standalone — conecta a Geotab para datos reales.</p></div>';
    });
}

// Variables globales de sesión (necesarias para navegar al mapa)
let _globalState = null;
let _serverStr = 'my.geotab.com';
let _databaseStr = '';

// Función global para navegar al mapa — usando la estructura EXACTA de la URL funcional
function navigateToTrip(event, deviceId, fromDate, toDate) {
    if (event) event.preventDefault();
    if (_globalState && typeof _globalState.gotoPage === 'function') {
        _globalState.gotoPage('tripsHistory', {
            devices: [deviceId], // Array de strings con el ID: !('b379')
            dateRange: {
                startDate: fromDate,
                endDate: toDate,
                label: 'Custom'
            },
            fromDate: fromDate,
            toDate: toDate
        });
    } else {
        const url = `https://${_serverStr}/${_databaseStr}/#tripsHistory,dateRange:(endDate:'${toDate}',label:Custom,startDate:'${fromDate}'),devices:!('${deviceId}'),fromDate:'${fromDate}',toDate:'${toDate}'`;
        window.open(url, '_blank');
    }
}

// Registro del addin con el key definido en el JSON
geotab.addin.blunvtcauditoria = function(api, state) {
    return {
        initialize: function(geotabApi, geotabState, callback) {
            // Guardar estado de sesión para la navegación al mapa
            _globalState = geotabState;

            // Obtener servidor y base de datos de la sesión
            geotabApi.getSession(function(session) {
                if (session) {
                    _serverStr = session.server || 'my.geotab.com';
                    _databaseStr = session.database || '';
                    const dbBadge = document.getElementById('dbNameBadge');
                    if (dbBadge) dbBadge.textContent = _databaseStr || 'blun';
                }
            });

            // Inicializar capa de datos
            DataManager.init(geotabApi);
            PassengerCamera.init(geotabApi);
            setDefaultDates();
            DataManager.getDevices().then(populateDeviceOptions).catch(e => console.warn('No se pudieron cargar vehículos', e));
            document.getElementById('dateFrom').addEventListener('change', updateRunState);
            document.getElementById('dateTo').addEventListener('change', updateRunState);
            
            // Binding de eventos UI
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            
            // Drag & Drop
            const dropZone = document.getElementById('dropZone');
            if (dropZone) {
                dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
                dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('drag'); });
                dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('drag');
                    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                        processFiles(e.dataTransfer.files);
                    }
                });
                dropZone.addEventListener('click', () => document.getElementById('fileInput').click());
            }

            document.getElementById('btnRun').addEventListener('click', runAudit);
            document.getElementById('btnExport').addEventListener('click', () => {
                UI.exportExcel(DataManager.getCsvData());
            });
            const btnPdf = document.getElementById('btnExportPDF');
            if (btnPdf) {
                btnPdf.addEventListener('click', () => {
                    UI.exportPDF(DataManager.getCsvData());
                });
            }

            // Avisar a Geotab que estamos listos
            callback();
        },
        focus: async function(geotabApi, geotabState) {
            _globalState = geotabState;
            // Buscar la regla en background al abrir el addin
            await RuleManager.init();
        },
        blur: function() {}
    };

    function toDateInputValue(value) {
        const date = new Date(value);
        const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return local.toISOString().slice(0, 10);
    }

    function setDefaultDates() {
        const to = new Date();
        const from = new Date(to);
        from.setDate(from.getDate() - 6);
        document.getElementById('dateFrom').value = toDateInputValue(from);
        document.getElementById('dateTo').value = toDateInputValue(to);
    }

    function updateRunState() {
        const from = document.getElementById('dateFrom').value;
        const to = document.getElementById('dateTo').value;
        document.getElementById('btnRun').disabled = !from || !to || from > to;
    }

    function populateDeviceOptions(devicesCache) {
        const sel = document.getElementById('filterVehicle');
        const selected = sel.value;
        sel.innerHTML = '<option value="all">Todos</option>';
        Object.values(devicesCache.byId).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'es')).forEach(device => {
            const option = document.createElement('option');
            option.value = device.id;
            option.textContent = device.name || device.id;
            sel.appendChild(option);
        });
        if (Array.from(sel.options).some(option => option.value === selected)) sel.value = selected;
    }
    function handleFileSelect(e) {
        if (e.target.files && e.target.files.length > 0) {
            processFiles(e.target.files);
        }
    }

    async function processFiles(fileList) {
        const files = Array.from(fileList);
        try {
            const fileDataPromises = files.map(file => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = e => resolve({ name: file.name, text: e.target.result });
                    reader.onerror = () => reject(new Error(`Error leyendo ${file.name}`));
                    reader.readAsText(file, 'utf-8');
                });
            });

            const filesData = await Promise.all(fileDataPromises);
            const stats = DataManager.parseMultipleCSVs(filesData);

            const filesStr = files.length === 1 ? files[0].name : `${files.length} archivos combinados`;
            document.getElementById('uploadLabel').innerHTML = 
                `<strong style="color:var(--ok);">✓ ${filesStr}</strong> — ${stats.tripsCount.toLocaleString('es')} viajes cargados`;
            
            document.getElementById('dateFrom').value = toDateInputValue(stats.minDate);
            document.getElementById('dateTo').value = toDateInputValue(stats.maxDate);
            document.getElementById('csvToleranceGroup').style.display = 'flex';
            updateRunState();
        } catch (err) {
            alert("Error al procesar archivos: " + err.message);
        }
    }

    async function runAudit() {
        const auditStartedAt = Date.now();
        UI.showLoading('Preparando período y vehículos...');
        try {
            const devicesCache = await DataManager.getDevices();
            populateDeviceOptions(devicesCache);
            const csvData = DataManager.getCsvData();
            const hasCsv = !!(csvData.trips && csvData.trips.length);
            const fromInput = document.getElementById('dateFrom').value;
            const toInput = document.getElementById('dateTo').value;
            if (!fromInput || !toInput || fromInput > toInput) throw new Error('Selecciona un rango de fechas válido.');
            const windowStart = new Date(fromInput + 'T00:00:00').getTime();
            const windowEnd = new Date(toInput + 'T23:59:59.999').getTime();
            const fromDate = new Date(windowStart).toISOString();
            const toDate = new Date(windowEnd).toISOString();
            const selectedDevice = document.getElementById('filterVehicle').value;
            const csvPlates = csvData.plates || new Set();
            const devices = Object.values(devicesCache.byId);
            const targetDevices = [];

            devices.forEach(device => {
                if (selectedDevice !== 'all' && device.id !== selectedDevice) return;
                if (hasCsv) {
                    const normName = DataManager.getNormPlate(device.name || '');
                    const normPlate = DataManager.getNormPlate(device.licensePlate || '');
                    const matchedCsvPlate = Array.from(csvPlates).find(plate => normName.includes(plate) || normPlate.includes(plate));
                    if (!matchedCsvPlate) return;
                    device._matchedCsvPlate = matchedCsvPlate;
                } else {
                    device._matchedCsvPlate = DataManager.getNormPlate(device.licensePlate || device.name || '');
                }
                targetDevices.push(device);
            });
            if (!targetDevices.length) throw new Error(hasCsv
                ? 'No hay vehículos seleccionados que coincidan con las matrículas del CSV.'
                : 'No hay vehículos disponibles para analizar.');

            const tolerance = hasCsv ? (parseInt(document.getElementById('tolerance').value) || 5) : 0;
            const cameraTolerance = Math.max(0, parseInt(document.getElementById('cameraTolerance').value) || 0) * 60000;
            const ruleId = RuleManager.hasParadaRapidaRule() ? RuleManager.getParadaRapidaId() : null;
            const dateRanges = hasCsv && csvData.dateRanges && csvData.dateRanges.length
                ? csvData.dateRanges
                : [{ min: new Date(windowStart), max: new Date(windowEnd), plates: new Set(Array.from(csvPlates)) }];
            const requests = [];
            for (const device of targetDevices) {
                let deviceStart = windowStart, deviceEnd = windowEnd;
                if (hasCsv) {
                    const deviceRanges = dateRanges.filter(range => range.plates && range.plates.has(device._matchedCsvPlate));
                    if (!deviceRanges.length) continue;
                    deviceStart = Math.max(windowStart, Math.min(...deviceRanges.map(range => range.min.getTime())));
                    deviceEnd = Math.min(windowEnd, Math.max(...deviceRanges.map(range => range.max.getTime())));
                    if (deviceStart > deviceEnd) continue;
                }
                requests.push({ device, fromDate: new Date(deviceStart).toISOString(), toDate: new Date(deviceEnd).toISOString() });
            }
            if (!requests.length) throw new Error('No hay vehículos con viajes dentro del período seleccionado.');
            UI.updateLoading(`Descargando viajes y paradas en lotes para ${requests.length} vehículos...`);
            const [vehicleData, cameraResult] = await Promise.all([
                DataManager.getTripsAndExceptionsBatch(requests, ruleId, 50, (done, total) => {
                    UI.updateLoading(`Consultas agrupadas: ${done}/${total} vehículos...`);
                }),
                PassengerCamera.fetchForDevices(requests.map(request => request.device), fromDate, toDate)
            ]);
            const allTrips = [];
            const allEvents = [];
            requests.forEach(request => {
                const result = vehicleData[request.device.id];
                const diagnostic = cameraResult.diagnosticsByDevice[request.device.id];
                if (result && result.error) {
                    if (diagnostic) diagnostic.tripQueryError = result.error;
                    console.warn('Error descargando viajes/paradas de', request.device.name, result.error);
                    return;
                }
                (result && result.trips || []).forEach(trip => { trip._device = request.device; });
                allTrips.push(...(result && result.trips || []));
                allEvents.push(...(result && result.exceptions || []));
            });
            const tripsInWindow = allTrips.filter(trip => {
                const start = new Date(trip.start || trip.startTime).getTime();
                const stop = new Date(trip.stop || trip.stopTime).getTime();
                const plate = trip._device._matchedCsvPlate;
                if (start > windowEnd || stop < windowStart) return false;
                if (!hasCsv) return true;
                return dateRanges.some(range => range.plates && range.plates.has(plate) && start <= range.max.getTime() && stop >= range.min.getTime());
            });
            if (ruleId) StopAnalyzer.analyzeTrips(tripsInWindow, allEvents);
            else tripsInWindow.forEach(trip => { trip._stopAnalysis = { quickStops: 0, totalStopTime: 0, maxStop: 0, stopLocations: [] }; });
            PassengerCamera.analyzeTrips(tripsInWindow, cameraResult, allEvents, cameraTolerance);
            UI.updateLoading(hasCsv ? 'Comparando ocupación con el CSV...' : 'Preparando resumen de ocupación...');

            const toleranceMs = tolerance * 60000;
            const enriched = tripsInWindow.map(trip => {
                const device = trip._device;
                const start = new Date(trip.start || trip.startTime);
                const stop = new Date(trip.stop || trip.stopTime);
                const csvMatches = hasCsv ? csvData.trips.filter(csvTrip => {
                    if (csvTrip.plate !== device._matchedCsvPlate) return false;
                    return Math.min(stop.getTime() + toleranceMs, csvTrip.arrTime.getTime()) >
                        Math.max(start.getTime() - toleranceMs, csvTrip.reqTime.getTime());
                }) : [];
                const row = {
                    gId: trip.id, gStart: start, gStop: stop, gDist: +(trip.distance || 0).toFixed(2),
                    gDur: Math.round((stop - start) / 60000), plate: device._matchedCsvPlate,
                    plateOrig: device.name, deviceId: device.id, deviceName: device.name,
                    hasCsv, matched: csvMatches.length > 0, csvCount: csvMatches.length,
                    _stopAnalysis: trip._stopAnalysis, _passengerAnalysis: trip._passengerAnalysis,
                    _matchedCsvTrips: csvMatches
                };
                row.audit = RiskEngine.evaluateTrip(row);
                return row;
            });
            const periodData = Object.assign({}, csvData, { minDate: fromDate, maxDate: toDate, elapsedSeconds: ((Date.now() - auditStartedAt) / 1000).toFixed(1) });
            UI._cachedData = { enriched, csvData: periodData, hasCsv, tolerance, targetDevices };
            UI.renderResults(enriched, periodData, tolerance, 0, targetDevices, hasCsv, cameraResult);
        } catch (error) {
            console.error(error);
            UI.showError('Error durante el análisis: ' + error.message);
        }
    }
};



</script>
